<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ECHO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#12181a; --surface:#1a2225; --surface-2:#212b2e;
    --ink:#dce7e6; --ink-soft:#93a5a3; --ink-faint:#5e7270;
    --line:#2a3538; --accent:#4fb8a6; --accent-soft:#1c3532;
    --warn:#d97757; --sys:#6f8280;
    --me:#274b46; --me-line:#3a6a63;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:"Inter","Noto Sans SC",system-ui,sans-serif;
  }
  .mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;}
  [hidden]{display:none!important;}

  /* ---------- 登录 ---------- */
  .login-wrap{max-width:340px;margin:8vh auto 0;padding:0 16px;}
  .login-logo{display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:22px;}
  .login-logo .mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#0d1414;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;}
  .login-logo .word{font-size:17px;font-weight:700;letter-spacing:.06em;color:var(--ink);}
  .login-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;}
  .login-card h2{font-size:13.5px;margin:0 0 4px;color:var(--ink);font-weight:600;}
  .login-card p.hint{font-size:11.5px;color:var(--ink-faint);line-height:1.7;margin:0 0 16px;}
  .login-card label{display:block;font-size:11px;color:var(--ink-faint);font-weight:600;margin:0 0 5px;letter-spacing:.02em;}
  .login-card input{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    font-size:13px;color:var(--ink);margin-bottom:12px;background:var(--surface-2);
    font-family:"JetBrains Mono",monospace;box-sizing:border-box;
  }
  .login-card input:focus{outline:none;border-color:var(--accent);}
  .login-card button{
    width:100%;background:var(--accent);color:#0d1414;border:none;border-radius:8px;
    padding:11px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .login-card button:hover{opacity:.88;}
  .login-err{font-size:11.5px;color:var(--warn);margin-top:10px;}
  .login-note{font-size:10.5px;color:var(--ink-faint);text-align:center;margin-top:16px;line-height:1.6;}

  /* ---------- 主界面 ---------- */
  header.app-top{
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:13px 18px; display:flex; align-items:center; gap:10px;
    position:sticky; top:0; z-index:5;
  }
  header.app-top .mark{width:24px;height:24px;border-radius:7px;background:var(--accent);color:#0d1414;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
  header.app-top .word{font-weight:700;font-size:13.5px;letter-spacing:.05em;}
  header.app-top .sub{font-size:11px;color:var(--ink-faint);margin-left:2px;}

  #app{max-width:640px;margin:0 auto;padding:18px 14px 60px;}

  .group-head{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .group-head .gname{font-size:14.5px;font-weight:600;}
  .group-head .gmeta{font-size:11px;color:var(--ink-faint);margin-top:3px;}
  .group-head .gtoggle{font-size:11.5px;color:var(--accent);cursor:pointer;margin-top:8px;display:inline-block;}
  .group-head .gtoggle:hover{text-decoration:underline;}
  .gname-history{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-soft);line-height:2;}
  .gname-history b{color:var(--ink);}
  .sig-note{font-size:10.5px;color:var(--ink-faint);line-height:1.6;margin:1px 0 6px;}

  .chat-log{display:flex;flex-direction:column;gap:10px;}
  .sysmsg{text-align:center;font-size:11px;color:var(--sys);margin:10px 0;font-family:"JetBrains Mono",monospace;}
  .sysmsg.warn{color:var(--warn);}
  .msg{display:flex;gap:9px;max-width:88%;}
  .msg .avatar{width:30px;height:30px;border-radius:8px;flex:none;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-faint);border:1px solid var(--line);}
  .msg .bubble{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.65;}
  .msg .who{font-size:11px;color:var(--accent);margin-bottom:3px;font-weight:600;}
  .msg .who[data-account-link]:hover{text-decoration:underline;}
  .msg .avatar[data-account-link]:hover{border-color:var(--accent);}
  .msg.hx .who{color:#d0a862;}
  .msg.deactivated .bubble{opacity:.55;}
  .msg.deactivated .who{color:var(--ink-faint);}
  .msg.failed .bubble{border-style:dashed;color:var(--ink-faint);}


  .photo-frame{
    display:block; width:170px; max-width:100%; margin:8px 0 4px; border:1px solid var(--line);
    border-radius:8px; overflow:hidden; cursor:zoom-in; background:#0a0f10;
  }
  .photo-frame.zoomed{width:320px; cursor:zoom-out;}
  .photo-frame svg, .photo-frame img{display:block;width:100%;height:auto;}
  .photo-frame.large{width:280px;}
  .photo-frame.large.zoomed{width:100%;}
  .photo-cap{font-size:11px;color:var(--ink-faint);margin:0 0 4px;}

  .app-tabs{display:flex;gap:6px;margin-bottom:14px;}
  .app-tabs button{
    flex:1;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);
    border-radius:8px;padding:9px;font-size:12.5px;font-weight:500;cursor:pointer;
    font-family:inherit;
  }
  .app-tabs button.active{background:var(--accent);color:#0d1414;border-color:var(--accent);font-weight:700;}

  .back-link{color:var(--accent);font-size:12.5px;cursor:pointer;margin-bottom:12px;display:inline-block;}
  .back-link:hover{text-decoration:underline;}
  .account-page{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 16px;}
  .account-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .account-head .aavatar{width:48px;height:48px;border-radius:10px;flex:none;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink-faint);font-weight:700;}
  .account-name{font-size:15px;font-weight:700;}
  .account-tag{font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .account-bio{font-size:13px;color:var(--ink-soft);margin:10px 0 14px;padding:10px 12px;background:var(--surface-2);border-radius:8px;}
  .account-pinned-label{font-size:11px;color:var(--ink-faint);font-weight:600;letter-spacing:.03em;margin-bottom:6px;}
  .review-table{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 12px;margin-bottom:14px;}
  .review-row{display:flex;justify-content:space-between;padding:7px 0;font-size:12.5px;border-bottom:1px dashed var(--line);}
  .review-row:last-child{border-bottom:none;}
  .review-row span:first-child{color:var(--ink-soft);}
  .review-row span:last-child{color:var(--ink);font-weight:600;}

  .gate-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 16px;}
  .gate-card p.hint{font-size:11.5px;color:var(--ink-faint);line-height:1.7;margin:0 0 14px;}
  .gate-card input{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    font-size:13px;color:var(--ink);margin-bottom:10px;background:var(--surface-2);
    font-family:"JetBrains Mono",monospace;box-sizing:border-box;
  }
  .gate-card input:focus{outline:none;border-color:var(--accent);}
  .gate-card button{
    width:100%;background:var(--accent);color:#0d1414;border:none;border-radius:8px;
    padding:11px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .gate-err{font-size:11.5px;color:var(--warn);margin-top:8px;}
</style>
</head>
<body>

<div class="login-wrap" id="login-wrap">
  <div class="login-logo"><div class="mark">E</div><div class="word">ECHO</div></div>
  <div class="login-card" id="login-card">
    <h2>登录</h2>
    <p class="hint">检测到这是一个很久没有登录过的账号，来自新设备。请输入账号信息继续。</p>
    <label>账号</label>
    <input id="li-user" type="text" placeholder="用户名" autocomplete="off" />
    <label>密码</label>
    <input id="li-pass" type="password" placeholder="密码" autocomplete="off" />
    <button id="li-btn">登录</button>
    <div id="li-msg"></div>
  </div>
  <div class="login-note">ECHO 早年是练习生和小团体之间很流行的一个通讯软件，后来慢慢没什么人用了，服务器倒是一直没关。</div>
</div>

<div class="login-wrap" id="verify-wrap" hidden>
  <div class="login-logo"><div class="mark">E</div><div class="word">ECHO</div></div>
  <div class="login-card">
    <h2>陌生设备验证</h2>
    <p class="hint">这个账号很久没有在新设备上登录过了。为了确认是本人操作，请回答账号绑定时设置的安全问题。</p>
    <label>最初的群聊有几个人？</label>
    <input id="ve-input" type="text" placeholder="……" autocomplete="off" />
    <div class="login-note" style="margin:0 0 12px;text-align:left;">试试接近的数字。</div>
    <button id="ve-btn">验证并进入</button>
    <div id="ve-msg"></div>
  </div>
</div>

<div id="main-wrap" hidden>
  <header class="app-top">
    <div class="mark">E</div>
    <div class="word">ECHO</div>
    <div class="sub">旧版 · 群聊存档</div>
  </header>
  <div id="app"></div>
</div>

<script>
  const USERNAME = "quietanson0716";
  // 密码只留日期本身，不再要求"安仔"昵称拼音——0719 单独就够，来源是
  // 林安超话 l14 那条阿福生日彩蛋，是这个游戏里少数几个还留着的传统
  // ARG 密码谜题，值得保留完整；p026 里"安仔"这个小名现在纯粹是人物
  // 塑造，不再是解密码要拼的一部分。
  const PASSWORD = "0719";
  const RECOVERY_ANSWERS = ["5", "五", "five", "5个", "五个", "5人", "五人"];

  // 有些输入法手动打字时会把字母数字打成全角，肉眼几乎看不出来，但和
  // 半角字符串直接比较会判定不相等——粘贴进来的内容不受输入法影响所以
  // 能通过，手打却总是提示"不正确"。先转回半角再做其余归一化。
  const toHalfWidth = (s) => s.replace(/[！-～]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, " ");
  const norm = (s) => toHalfWidth(s).trim().toLowerCase().replace(/[\s@._-]/g, "");

  const loginWrap = document.getElementById("login-wrap");
  const verifyWrap = document.getElementById("verify-wrap");
  const mainWrap = document.getElementById("main-wrap");

  document.getElementById("li-btn").addEventListener("click", tryLogin);
  document.getElementById("li-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });
  function tryLogin() {
    const u = norm(document.getElementById("li-user").value);
    const p = norm(document.getElementById("li-pass").value);
    const msg = document.getElementById("li-msg");
    if (u === norm(USERNAME) && p === norm(PASSWORD)) {
      loginWrap.hidden = true;
      verifyWrap.hidden = false;
      return;
    }
    msg.innerHTML = `<div class="login-err">账号或密码不正确。</div>`;
  }

  document.getElementById("ve-btn").addEventListener("click", tryVerify);
  document.getElementById("ve-input").addEventListener("keydown", (e) => { if (e.key === "Enter") tryVerify(); });
  function tryVerify() {
    const val = norm(document.getElementById("ve-input").value);
    const msg = document.getElementById("ve-msg");
    if (RECOVERY_ANSWERS.map(norm).includes(val)) {
      verifyWrap.hidden = true;
      mainWrap.hidden = false;
      sessionStorage.setItem("echo-logged-in", "1");
      renderApp();
      return;
    }
    msg.innerHTML = `<div class="login-err">回答不正确，安全起见暂时无法进入。</div>`;
  }

  const GROUP_NAMES = [
    { name: "出道预备A组（5）", note: "最早建群时的名字。" },
    { name: "NOV5（5）", note: "确定组合方向后改的。" },
    { name: "项目确认群（5）", note: "公司正式确认项目后又改了一次。" },
    { name: "F4ever成员群（4）", note: "最后一次改名，成员数从 5 变成了 4。第五个人的账号从这之后就一直显示『已注销』。" },
  ];

  let activeAppTab = "f4ever";

  function renderApp() {
    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="app-tabs">
        <button data-tab="f4ever">F4ever成员群</button>
        <button data-tab="staff">林安对接群</button>
      </div>
      <div id="tab-pane"></div>
    `;
    app.querySelectorAll(".app-tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeAppTab = btn.dataset.tab;
        activeAccountPage = null;
        renderTabPane();
      });
    });
    renderTabPane();
  }

  let activeAccountPage = null;

  const ACCOUNT_PAGES = {
    hx404: {
      name: "HX_404",
      tag: "项目编号 H-X-04 ｜ 姓名：贺寻 ｜ 生日：06-11 ｜ 已注销",
      bio: "梦想是出道",
      pinnedImage: "images/mic-hx404.png",
      pinnedCaption: "自己做的记号，不然天天跟别人拿混",
      // 这份旧月评是专门用来推翻"贺寻是不是实力不够才没出道"这个第一
      // 直觉的——综合排名 2/11，镜头表现是唯一明显偏弱的一项，跟后面
      // GW 商业测试文件里"首轮关注转化最低"是两个不同维度的评价，不
      // 冲突：一个是专业老师打分，一个是市场测试数据。
      monthlyReview: {
        period: "2018 Q4 · 内部月评存档",
        rows: [
          ["舞蹈", "A-"],
          ["声乐", "B"],
          ["舞台稳定", "A"],
          ["团队协作", "A"],
          ["镜头表现", "C+"],
          ["综合排名", "2 / 11"],
        ],
        clue: "c55",
      },
    },
    newprod: {
      name: "新_PROD",
      tag: "巡演制作协调",
      bio: "",
      pinnedImage: "images/mic-newprod.png",
      pinnedCaption: "工作人员用麦克风，别乱拿",
    },
  };

  const ACCOUNT_LINK_BY_NAME = { "HX_404": "hx404", "新_PROD": "newprod" };

  function openAccountPage(id) {
    activeAccountPage = id;
    renderTabPane();
  }

  function renderAccountPage(pane, id) {
    const data = ACCOUNT_PAGES[id];
    pane.innerHTML = `
      <div class="back-link" id="account-back">‹ 返回</div>
      <div class="account-page">
        <div class="account-head">
          <div class="aavatar">${data.name.slice(0, 1)}</div>
          <div>
            <div class="account-name">${data.name}</div>
            <div class="account-tag mono">${data.tag}</div>
          </div>
        </div>
        ${data.bio ? `<div class="account-bio">${data.bio}</div>` : ""}
        ${data.pinnedImage ? `
          <div class="account-pinned-label">置顶</div>
          <div class="photo-frame large" id="${id}-pinned">
            <img src="${data.pinnedImage}" alt="${data.pinnedCaption}" />
          </div>
          <div class="photo-cap">${data.pinnedCaption}</div>
        ` : ""}
        ${data.monthlyReview ? `
          <div class="account-pinned-label">${data.monthlyReview.period}</div>
          <div class="review-table">
            ${data.monthlyReview.rows.map(([k, v]) => `<div class="review-row"><span>${k}</span><span class="mono">${v}</span></div>`).join("")}
          </div>
        ` : ""}
        ${data.sigHistory ? `
          <div class="gtoggle" id="sig-toggle">‹ 查看个性签名历史</div>
          <div id="sig-history" hidden></div>
        ` : ""}
      </div>
    `;
    document.getElementById("account-back").addEventListener("click", () => {
      activeAccountPage = null;
      renderTabPane();
    });
    pane.querySelectorAll(".photo-frame").forEach((f) => {
      f.addEventListener("click", () => f.classList.toggle("zoomed"));
    });
    const sigToggle = document.getElementById("sig-toggle");
    if (sigToggle) {
      sigToggle.addEventListener("click", () => {
        const el = document.getElementById("sig-history");
        el.hidden = !el.hidden;
        el.innerHTML = `<div class="gname-history">${data.sigHistory.map((s) =>
          `<div><b>${s.time}</b> — <span class="mono">${s.text}</span>${s.note ? `<div class="sig-note">${s.note}</div>` : ""}</div>`
        ).join("")}</div>`;
      });
    }
  }

  function renderTabPane() {
    const app = document.getElementById("app");
    app.querySelectorAll(".app-tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === activeAppTab));
    const pane = document.getElementById("tab-pane");
    if (activeAccountPage) {
      renderAccountPage(pane, activeAccountPage);
      return;
    }
    if (activeAppTab === "f4ever") {
      pane.innerHTML = `
        <div class="group-head">
          <div class="gname">F4ever成员群（4）</div>
          <div class="gmeta">群成员：4 · 另有 1 个账号状态异常</div>
          <div class="gtoggle" id="gname-toggle">‹ 查看群名变更记录</div>
          <div id="gname-history" hidden></div>
        </div>
        <div class="chat-log" id="chat-log"></div>
      `;
      document.getElementById("gname-toggle").addEventListener("click", () => {
        const el = document.getElementById("gname-history");
        el.hidden = !el.hidden;
        el.innerHTML = `<div class="gname-history">${GROUP_NAMES.map((g) => `<div><b>${g.name}</b> — ${g.note}</div>`).join("")}</div>`;
      });
      renderChatLog(document.getElementById("chat-log"));
    } else if (activeAppTab === "staff") {
      renderStaffTab(pane);
    }
  }

  function sys(text, warn) {
    return `<div class="sysmsg${warn ? " warn" : ""}">${text}</div>`;
  }
  function msg(who, text, cls) {
    const initial = who.slice(0, 1);
    const accountId = ACCOUNT_LINK_BY_NAME[who];
    const linkAttr = accountId ? ` data-account-link="${accountId}"` : "";
    return `
      <div class="msg ${cls || ""}">
        <div class="avatar"${linkAttr}>${initial}</div>
        <div>
          <div class="who"${linkAttr}>${who}</div>
          <div class="bubble">${text}</div>
        </div>
      </div>
    `;
  }

  // HX_404/新_PROD 头像和用户名统一走这个绑定——群消息里出现的每一次
  // 都可以点进去，麦克风照片只在各自的主页里能看到，不再直接挂在
  // 消息下面，跟其他账号资料的浏览方式一致。
  function bindAccountLinks(el) {
    el.querySelectorAll("[data-account-link]").forEach((node) => {
      node.style.cursor = "pointer";
      node.addEventListener("click", (e) => {
        e.stopPropagation();
        openAccountPage(node.dataset.accountLink);
      });
    });
  }

  function renderChatLog(el) {
    let html = "";

    html += sys("群名由「出道预备A组（5）」改为「NOV5（5）」");

    html += sys("2019-03-07");
    html += msg("江彻", "今天又量尺寸？？");
    html += msg("林安", "我上周不是量过了吗");
    html += msg("HX_404", "舞台服，跟上次拍照那套不一样", "hx");
    html += msg("许嘉树", "所以这次是真的要定了？");
    html += msg("周晏星", "你第几次说『真的要定了』了");
    html += msg("HX_404", "至少这次五个人都量了", "hx");
    html += msg("林安", "截图了，以后谁没出道我拿出来嘲笑谁");
    html += msg("HX_404", "那你最好永远别发出来", "hx");

    html += msg("HX_404", "谁拿了我牛奶？");
    html += msg("林安", "晏星。");
    html += msg("周晏星", "林安你是不是想死。");
    html += msg("江彻", "明早六点集合，你们三个还不睡？");

    html += msg("林安", "谁占了三号练习室");
    html += msg("HX_404", "我", "hx");
    html += msg("林安", "我两点有声乐课😭");
    html += msg("HX_404", "知道", "hx");
    html += msg("HX_404", "给你占的", "hx");
    html += msg("林安", "？");
    html += msg("林安", "你今天怎么这么像人");
    html += msg("HX_404", "滚", "hx");

    html += msg("周晏星", "谁有吃的");
    html += msg("HX_404", "冰箱第二层", "hx");
    html += msg("周晏星", "你的？");
    html += msg("HX_404", "现在不是了", "hx");
